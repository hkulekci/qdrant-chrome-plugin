name: Update Qdrant versions

on:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate qdrant-versions.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run update-versions

      - name: Read latest version
        id: latest
        run: |
          latest=$(grep "LATEST_KNOWN_VERSION" src/lib/qdrant-versions.ts | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update known Qdrant versions to ${{ steps.latest.outputs.version }}"
          title: "Update known Qdrant versions to ${{ steps.latest.outputs.version }}"
          body: |
            Automated update of `src/lib/qdrant-versions.ts` from the live
            [qdrant/qdrant releases](https://github.com/qdrant/qdrant/releases).

            Latest known version: **${{ steps.latest.outputs.version }}**
          branch: chore/update-qdrant-versions
          delete-branch: true
          add-paths: src/lib/qdrant-versions.ts
