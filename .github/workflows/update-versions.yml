name: Update Qdrant versions

on:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate qdrant-versions.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run update-versions

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/lib/qdrant-versions.ts; then
            echo "Qdrant versions already up to date."
            exit 0
          fi
          latest=$(grep "LATEST_KNOWN_VERSION" src/lib/qdrant-versions.ts | sed "s/.*'\(.*\)'.*/\1/")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/qdrant-versions.ts
          git commit -m "Update known Qdrant versions to ${latest}"
          git push
